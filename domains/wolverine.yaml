# Wolverine Glacier, Alaska: USGS 15236900 Wolverine Creek near Lawing, 1 GRU of 3 elevation-band HRUs
project_dir: data/domain_Wolverine            # copied from SYMFLUENCE_data, then rebuilt here
bounding_box: 60.44/-148.97/60.36/-148.85       # lat_max/lon_min/lat_min/lon_max
pour_point: 60.36999097/-148.8988085            # lat/lon of the gauge
utm_crs: EPSG:32606
utm_epsg: 32606
rgi6_region: 01Alaska
min_glacier_size_km2: 1
min_debris_thickness: 0.04

data:
  rgi: data/external/RGI_data
  debris_extent: data/external/Debris_data
  debris_thickness: data/external/Debris_thick
  ice_thickness: data/external/Thickness_data
  usgs_outlines: data/external/GlacierDEM/USGS_Glacier_Boundaries_shp/USGS_Glacier_Boundaries.shp
usgs_outline: {glacier: Wolverine Glacier, date: 2006/08/08, dem: data/external/GlacierDEM/EasternKenai_20060808_DEM/EasternKenai_20060808_DEM.tif}  # the survey before the 2008 start, in place of RGI's
millan_reference: {date: 2015/08/13, dem: data/external/GlacierDEM/EasternKenai_20150813_DEM/EasternKenai_20150813_DEM.tif}  # the survey inside Millan's 2010-2020 decade; the bed is it less his thickness
later_outline: {date: 2020/10/19, dems: data/external/GlacierDEM/ArcticDEM_Wolverine}  # the last survey; ArcticDEM strips after it give the bed where ice melted out
usgs_datum: -14.0                               # m added to USGS heights (WGS84 ellipsoid) to give the model DEM's

forcing_period: {first: 2004-10, last: 2026-09}
# observations over forcing_period (acquire_observations.py); each key optional, the mass balance is the USGS benchmark glaciers' only
observations:
  streamflow: {source: usgs, gauge: "15236900"}
  stream_temperature: {site: "15236900"}
  grace: true
  mass_balance: {release: storage/mass_balance/Output_Wolverine_Glacier_Wide_solutions_calibrated.csv, balance: seasonal}
  velocity: true
  lake_area:
    - {name: wolverine_lake, box: [-148.918, 60.3720, -148.905, 60.3775], usgs_site: "15236900"}

# late-summer scenes check_glacier_imagery.py compares with the starting and final glacier
imagery: {landsat: [2004, 2005, 2009, 2010], sentinel: [2019, 2021, 2025, 2026]}

cold_start: 2008-01
soil_offset: 1.5
ice_temp: -5.0

stations: observations/stations
stakes: observations/storage/mass_balance/Input_Wolverine_Glaciological_Data.csv
gauge_shield: SA                                # single-Alter shield on the 990 m weighing gauge
precip_grad: true                               # SUMMA precipElevGrad fitted with the stake ratios

# the bundled stream-temperature test: one reach from the terminus to the gauge (add_stream_hru.py)
stream_hru:
  first_month: 2016-01
  last_month: 2019-12
  length: 2000
  slope: 0.03
  width: 5
  elevation: 390
  latitude: 60.374
  longitude: -148.912
