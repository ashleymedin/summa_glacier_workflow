# Wolverine Glacier, general setup: global data only (RGI and Herreid outlines, MERIT surface, Millan thickness, ArcticDEM), raw ERA5.
# The run of this basin without the USGS surveys, stations and stakes; the added-data setup is wolverine.yaml.
project_dir: data/domain_Wolverine_general
domain: Wolverine
seed_from: data/domain_Wolverine
bounding_box: 60.44/-148.97/60.36/-148.85
pour_point: 60.36999097/-148.8988085
utm_crs: EPSG:32606
utm_epsg: 32606
rgi6_region: 01Alaska
min_glacier_size_km2: 1
min_debris_thickness: 0.04

data:
  rgi: data/external/RGI_data
  debris_extent: data/external/Debris_data
  debris_thickness: data/external/Debris_thick
  ice_thickness: data/external/Thickness_data

small_meltout: {dems: data/external/GlacierDEM/ArcticDEM_Wolverine_series, glaciers: [RGI60-01.09162]}
glacier_dem: {dems: data/external/Copernicus_GLO30/*.tif, date: 2012/07/01, dhdt: data/external/Hugonnet/01_02_rgi60_2000-01-01_2020-01-01/dhdt/*.tif}  # TanDEM-X 2011-14; glacier cells off the surveys, carried to cold_start at the 2000-19 rates

hru_bands: [950, 1315]                          # elevation band edges, m, of the HRUs (make_hrus.py)
stream_network: wolverine_network.json            # the tributary network of the two-stream test (add_stream_network.py)
basin_within: huc12                             # clip the basin to the USGS HUC12 of the gauge (acquire_nhd.py), US only

forcing_period: {first: 2004-10, last: 2026-09}
precip_climatology: data/external/CHELSA/CHELSA_bio12_1981-2010_V.2.1_Wolverine.tif   # each HRU's raw precipitation scaled by its CHELSA ratio to the ERA5 cells' (acquire_climatology.py)
wind_climatology: data/external/CHELSA/CHELSA_sfcWind_1981-2010_V.2.1_Wolverine.tif   # by month, each HRU's raw wind scaled to CHELSA's mean over it (acquire_climatology.py)
start_debris_scenes: [../domain_Wolverine/observations/imagery/imagery_landsat_2004-08-29.tif, ../domain_Wolverine/observations/imagery/imagery_landsat_2005-08-08.tif]  # imagery classes near the start; debris mapped ~2010 that they show as ice starts clean
cold_start: 2004-10
soil_offset: 1.5
ice_temp: -1.0
