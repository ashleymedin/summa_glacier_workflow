# SUMMA cases built from the glacier domains by build_cases.py. Paths are relative to this file.
# first_month is the cold start: the calibration spins up over the year before its start_time, from it.

# a short Wolverine calibration with its routed reach, discharge, stream temperature and mass balance:
# spin-up 2016, scored 2017-2019
wolverine_test:
  domain: wolverine
  dest: tests/wolverine
  first_month: 2016-01
  last_month: 2019-12
  forcing: raw
  stream: {length: 2100, slope: 0.03, width: 5, elevation: 390, latitude: 60.374, longitude: -148.912}


# a short Gulkana calibration, discharge and mass balance: spin-up 2008, scored 2009-2012
gulkana_test:
  domain: gulkana
  dest: tests/gulkana
  first_month: 2008-01
  last_month: 2012-12
  forcing: raw

# stream reaches: length is the NHD path from the ice front to the gauge, the front found from the ArcticDEM strips (nhd_reach.py; added
# setup: Wolverine 2058 m, Gulkana 2562 m; general setup 2158 and 1950 m), width the mean wet width read from the 1 m image (Gulkana 3.5 m
# over 1.2 km of moraine, 40 m over the 1.4 km fan, 60 m over the rest: 30 m; Wolverine's creek, not its lake, 5 m, to be measured); the
# reach should follow the terminus as it retreats, which the model does not do yet
# summa's calibration test domain: both glaciers as one domain of 2 GRUs, each with a stream HRU and a reach,
# Oct 2015 - Jul 2018: a spin-up year, then the shortest span that holds two seasonal balances (Oct 2017 and
# May 2018), each with a year before it and 60 days after. The Gulkana reach, from the glacier to USGS 15478040, is
# an estimate.
gulkana_wolverine:
  merge:
    - domain: gulkana
      stream: {length: 2600, slope: 0.03, width: 30, elevation: 1200, latitude: 63.247, longitude: -145.455}
    - domain: wolverine
      stream: {length: 2100, slope: 0.03, width: 5, elevation: 390, latitude: 60.374, longitude: -148.912}
  dest: ../summa/utils/test/test_calibration/gulkana_wolverine
  first_month: 2015-10
  last_month: 2018-07
  forcing: raw
  forcing_name: "GulkanaWolverine_{Y}-{M}-01-00-00-00.nc"

# the two runs of each basin in glacier.tex, Oct 2004 - Sep 2026: spin-up WY2005, calibrated WY2006-2015, evaluated WY2016-2026
# general: the global data only (domains/<basin>_general.yaml), raw ERA5, scored on discharge and the annual mass change of the WGMS annual mass-change estimates (Dussaillant et al., 2025)
# added:   the USGS surveys, stations and stakes (domains/<basin>.yaml), station-corrected ERA5, discharge and the seasonal mass balance
# `./run_study.py <basin>` builds and calibrates both; first_month needs the ERA5 of 2004-2008 (acquire_era5.py)
wolverine_general:
  domain: wolverine_general
  dest: runs/wolverine_general
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: raw
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-09-30]
  targets: [discharge, wgms_amce]

wolverine_added:
  domain: wolverine
  dest: runs/wolverine_added
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: station_corrected
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-09-30]
  targets: [discharge, mass_balance, stream_temperature]

gulkana_general:
  domain: gulkana_general
  dest: runs/gulkana_general
  template: tests/gulkana/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: raw
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-09-30]
  targets: [discharge, wgms_amce]

gulkana_added:
  domain: gulkana
  dest: runs/gulkana_added
  template: tests/gulkana/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: station_corrected
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-09-30]
  targets: [discharge, mass_balance]

# the earlier full runs of glacier.tex: spin-up 2008, calibrated 2009-2015, evaluated 2016-2022
wolverine_raw:
  calibrate: [2009-01-01, 2015-12-31]
  evaluate: [2016-01-01, 2022-12-31]
  domain: wolverine
  dest: runs/wolverine_raw
  template: tests/wolverine/summa_inputs
