# SUMMA cases built from the glacier domains by build_cases.py. Paths are relative to this file.
# first_month is the cold start: the calibration spins up over the year before its start_time, from it.

# the tests are on the general setup (the global data only, raw ERA5 free air)
# Every change to the general forcing or its parameters (the general domains' YAMLs, remap_forcing.py, the Site B factors against
# it, the templates' fixed values) must be carried to all the glacier test cases: rebuild wolverine_test, gulkana_test,
# gulkana_wolverine (summa multi-calib; develop's copy without stream HRUs by scratch/2026-11-17/develop_testcase/strip_stream.py)
# and gulkana_wolverine_testcases (copied to summa_test_cases, forcing to input_data, then tools/convert_to_float.py there).
# Stream cases take every parameter of their non-stream parent case (parent:), so rebuild them after a change to it.
# a short Wolverine calibration with its routed reach, discharge, stream temperature and mass balance:
# spin-up 2016, scored 2017-2019
wolverine_test:
  domain: wolverine_general
  dest: tests/wolverine
  first_month: 2016-01
  last_month: 2019-12
  forcing: raw
  stream: {length: 2100, slope: 0.03, width: 5, elevation: 390, latitude: 60.374, longitude: -148.912}


# a short Gulkana calibration, discharge and mass balance: spin-up 2008, scored 2009-2012
gulkana_test:
  domain: gulkana_general
  dest: tests/gulkana
  first_month: 2008-01
  last_month: 2012-12
  forcing: raw

# stream reaches: length is the NHD path from the ice front to the gauge, the front found from the ArcticDEM strips (nhd_reach.py; added
# setup: Wolverine 2058 m, Gulkana 2562 m; general setup 2158 and 1950 m), width the mean wet width read from the 1 m image (Gulkana 3.5 m
# over 1.2 km of moraine, 40 m over the 1.4 km fan, 60 m over the rest: 30 m; Wolverine's creek, not its lake, 5 m, to be measured); the
# reach should follow the terminus as it retreats, which the model does not do yet
# summa's calibration test domain: both glaciers as one domain of 2 GRUs, each with a stream HRU and a reach,
# Oct 2015 - Jul 2018: a spin-up year, then the shortest span that holds two seasonal balances (Oct 2017 and
# May 2018), each with a year before it and 60 days after. The Gulkana reach, from the glacier to USGS 15478040, is
# an estimate.
gulkana_wolverine:
  merge:
    - domain: gulkana_general
      stream: {length: 2600, slope: 0.03, width: 30, elevation: 1200, latitude: 63.247, longitude: -145.455}
    - domain: wolverine_general
      stream: {length: 2100, slope: 0.03, width: 5, elevation: 390, latitude: 60.374, longitude: -148.912}
  dest: ../summa/utils/test/test_calibration/gulkana_wolverine
  first_month: 2015-10
  last_month: 2018-07
  forcing: raw
  forcing_name: "GulkanaWolverine_{Y}-{M}-01-00-00-00.nc"

# summa_test_cases' gulkana_wolverine (test_cases/settings/multiGruTestCases/gulkana_wolverine): the same two general domains
# without the stream HRUs, Oct 2008 - Dec 2009. Built here, then its attributes.nc, coldState.nc and trialParams.nc copied to
# that folder and its forcing to test_cases/input_data/gulkana_wolverine, where tools/convert_to_float.py writes the single precision
gulkana_wolverine_testcases:
  merge:
    - domain: gulkana_general
    - domain: wolverine_general
  dest: tests/gulkana_wolverine_testcases
  template: ../summa/utils/test/test_calibration/gulkana_wolverine/summa_inputs
  first_month: 2008-10
  last_month: 2009-12
  forcing: raw
  forcing_name: "GulkanaWolverine_{Y}-{M}-01-00-00-00_double_precision.nc"

# the two runs of each basin in glacier.tex, Oct 2004 - Sep 2026: spin-up WY2005, calibrated WY2006-2015, evaluated WY2016-2026
# general: the global data only (domains/<basin>_general.yaml), raw ERA5, scored on discharge and the annual mass change of the WGMS annual mass-change estimates (Dussaillant et al., 2025)
# added:   the USGS surveys, stations and stakes (domains/<basin>.yaml), station-corrected ERA5, discharge and the seasonal mass balance
# `./run_study.py <basin>` builds and calibrates both; first_month needs the ERA5 of 2004-2008 (acquire_era5.py)
wolverine_general:
  domain: wolverine_general
  dest: runs/wolverine_general
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: raw
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-09-30]
  targets: [discharge, wgms_amce]
  upland_soil: {class: sandy loam, sand: 0.54}  # SoilGrids 2.0 (scratch/2026-11-19/soilgrids_texture.py)

wolverine_added:
  domain: wolverine
  dest: runs/wolverine_added
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: station_corrected
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-09-30]
  targets: [discharge, mass_balance]
  upland_soil: {class: sandy loam, sand: 0.54}  # SoilGrids 2.0 (scratch/2026-11-19/soilgrids_texture.py)

gulkana_general:
  domain: gulkana_general
  dest: runs/gulkana_general
  template: tests/gulkana/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: raw
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-09-30]
  targets: [discharge, wgms_amce]
  upland_soil: {class: loam, sand: 0.49}  # SoilGrids 2.0 (scratch/2026-11-19/soilgrids_texture.py)

gulkana_added:
  domain: gulkana
  dest: runs/gulkana_added
  template: tests/gulkana/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: station_corrected
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-09-30]
  targets: [discharge, mass_balance]
  upland_soil: {class: loam, sand: 0.49}  # SoilGrids 2.0 (scratch/2026-11-19/soilgrids_texture.py)
  air_cooling: site_b  # glacierTempReduction from Gulkana Site B against this forcing, not Shaw et al.'s k

lemon_general:  # ends 2026-07 until NCAR or the CDS has Aug-Sep 2026
  domain: lemon_creek_general
  dest: runs/lemon_general
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2026-07
  forcing: raw
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-07-31]
  targets: [discharge, wgms_amce]
  upland_soil: {class: sandy loam, sand: 0.55}  # SoilGrids 2.0 (scratch/2026-11-24/soilgrids_lemon.py)

lemon_added:  # ends 2026-07 until NCAR or the CDS has Aug-Sep 2026
  domain: lemon_creek
  dest: runs/lemon_added
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2026-07
  forcing: station_corrected
  copy_forcing: false
  calibrate: [2005-10-01, 2015-09-30]
  evaluate: [2015-10-01, 2026-07-31]
  targets: [discharge, mass_balance]
  upland_soil: {class: sandy loam, sand: 0.55}  # SoilGrids 2.0 (scratch/2026-11-24/soilgrids_lemon.py)

# Slate Creek, no glacier: 3 GRUs, each with a stream HRU and a reach on its NHD stream (add_stream_grus.py), routed to the gauge.
# The span is the 29 months with ERA5 pressure levels so far, to test the build; extend once the NCAR downloads finish.
slate_stream:
  domain: slate_creek
  dest: runs/slate_stream
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2007-02
  forcing: raw
  stream: grus
  decisions: {deepTherml: bedrockLyrs, hyporhTdyn: proxy}
  calibrate: [2005-10-01, 2006-09-30]
  evaluate: [2006-10-01, 2007-02-28]
  targets: [discharge, stream_temperature]
  upland_soil: {class: loam, sand: 0.44}  # SoilGrids 2.0 (scratch/2026-11-24/soilgrids_slate.py)

# the stream-temperature runs: the added setup (all of its parameters, from parent) with a stream HRU, a reach and a wetland domain in the terminus HRU, which takes the
# glacier's runoff and releases it to the reach; hyporheic exchange and the bedrock layers on. Spun up over WY2005 like paper 1,
# calibrated WY2006-2019 so it holds four of Wolverine's water-temperature summers (2016-2019, six left for WY2020-2026);
# Gulkana's one summer (2006) is calibration only
# wetland: elevation is the bed DEM's there. Wolverine's is the lake, shut under the ice at the start: it opens as the glacier
# leaves the lowest bed cells of the lake box (mask) and its area follows its volume up to the imagery's largest (0.057 km2);
# the bed filled to that area holds it 2.25 m deep on average, its stage as the area to the 0.59 (scratch/2026-11-13/lake_depth.py)
# and it fills with fine silt (settling 1e-5 m/s) carried at 7.5e-4 m3 of deposit per m3 of glacier runoff, the share that settles
# 1 - exp(-w_s A/Q), fitted to its July-August area since 2013 (scratch/2026-11-13/infill_fit.py)
# Gulkana's is the braided fan at a fixed area, 1.4 km of threads wetting 40 m, its reach the 1.2 km of moraine above it
# Wolverine with its braided delta as a second wetland above the lake: Sentinel-2 has it 0.008-0.016 km2 (median 0.012) at the
# lake's head with little change with flow, and its flat ground under the tongue until 2012 (scratch/2026-11-13/forefield_wetted.py),
# so it opens on the lake's basin cells with it, up to 12,000 m2, takes the glacier runoff and drains to the lake. The lake takes
# the fetch roughness; bedrock layers on, as in the other stream cases
wolverine_stream_delta:
  domain: wolverine
  dest: runs/wolverine_stream_delta
  parent: wolverine_added                       # its parameters, plus the stream's own
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: station_corrected
  stream: {length: 2100, slope: 0.03, width: 5, elevation: 390, latitude: 60.374, longitude: -148.912, outlet_elevation: 377}
  wetland: {area: 0, max_area: 57000, mask: 0, elevation: 425, outlet_depth: 2.25, shape: 0.59, sed_conc: 7.5e-4, settle_vel: 1.0e-5,
            fetch: 200}
  delta: {area: 0, max_area: 12000, elevation: 430, outlet_depth: 0.1, shape: 1.0, sed_conc: 0.0, settle_vel: 1.0, fetch: 0,
          use_mask: 1, feeds_next: 1}
  decisions: {deepTherml: bedrockLyrs, hyporhTdyn: proxy}
  calibrate: [2005-10-01, 2019-09-30]
  evaluate: [2019-10-01, 2026-09-30]
  targets: [discharge, mass_balance, stream_temperature]

# Lemon Creek's reach, ice front to gauge through the lake chain: the NHD path (nhd_reach.py, 4657 m), slope and mean elevation its fall on
# the bed DEM, width the median of the gauge's 244 measurements at USGS 15052000 (12.5 m). The three lakes are one
# wetland of fixed area (0.15 km2 in late-summer 2025; open water since before the start, so no mask), in the 600-1000 m HRU that holds the
# upper two. The DEMs hold their water surface, so the depth is the banks' slopes carried under the water, 11 m, 7-17 m by the slope taken
# (scratch/2026-11-24/lemon_lake_depth.py); the elevation is area-weighted (851, 712 and 543 m)
lemon_stream:
  domain: lemon_creek
  dest: runs/lemon_stream
  parent: lemon_added
  template: tests/wolverine/summa_inputs
  first_month: 2004-10
  last_month: 2026-07
  forcing: station_corrected
  stream: {length: 4660, slope: 0.097, width: 12.5, elevation: 438, latitude: 58.4023, longitude: -134.3979, outlet_elevation: 221}
  wetland: {area: 150000, hru: 2, elevation: 761, depth: 11, outlet_depth: [11, 7, 17], fetch: 250}
  decisions: {deepTherml: bedrockLyrs, hyporhTdyn: proxy}
  calibrate: [2005-10-01, 2019-09-30]
  evaluate: [2019-10-01, 2026-07-31]
  targets: [discharge, mass_balance, stream_temperature]

gulkana_stream:
  domain: gulkana
  dest: runs/gulkana_stream
  parent: gulkana_added                       # its parameters, plus the stream's own
  template: tests/gulkana/summa_inputs
  first_month: 2004-10
  last_month: 2026-09
  forcing: station_corrected
  stream: {length: 1200, slope: 0.03, width: 3.5, elevation: 1220, latitude: 63.247, longitude: -145.455, outlet_elevation: 1137}
  wetland: {area: 56000, elevation: 1170, outlet_depth: [0.05, 0.01, 0.5]}
  decisions: {deepTherml: bedrockLyrs, hyporhTdyn: proxy}
  calibrate: [2005-10-01, 2019-09-30]
  evaluate: [2019-10-01, 2026-09-30]
  targets: [discharge, mass_balance, stream_temperature]
