  domain: gulkana
  dest: runs/gulkana_raw
  template: tests/gulkana/summa_inputs
  first_month: 2008-01
  last_month: 2022-12
  forcing: raw
  copy_forcing: false

gulkana_corrected:
  calibrate: [2009-01-01, 2015-12-31]
