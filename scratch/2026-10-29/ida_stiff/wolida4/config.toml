# generated by test_calibration_wolverine.sh

[simulation]

case_name = "gulkana_wolverine"

# one spinup year (Oct 2015 - Sep 2016) precedes the simulation, which the calibration then scores
start_time = "2016-10-01 00:00"
end_time   = "2018-07-31 23:00"
time_zone  = "utcTime"

use_mizuroute    = true
write_timeseries = false

work_path = "/Users/amedin/Research/SummaSundials/summa_glacier_workflow/scratch/2026-10-29/ida_stiff/wolida4/output"


[summa_files]

settings_path = "/Users/amedin/Research/SummaSundials/summa_glacier_workflow/scratch/2026-10-29/ida_stiff/wolida4/inputs/"
forcing_path  = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_wolverine/forcing/"
state_path    = "/Users/amedin/Research/SummaSundials/summa_glacier_workflow/scratch/2026-10-29/ida_stiff/wolida4/state/"
output_path   = "/Users/amedin/Research/SummaSundials/summa_glacier_workflow/scratch/2026-10-29/ida_stiff/wolida4/output/"

init_condition = "coldState.nc"
attributes     = "attributes.nc"
forcing_list   = "forcingFileList.txt"

decisions        = "modelDecisions.txt"
output_control   = "outputControl.txt"
trial_params     = "trialParams.nc"
local_parameters = "localParamInfo.txt"
basin_parameters = "basinParamInfo.txt"

vegetation_table = "TBL_VEGPARM.TBL"
soil_table       = "TBL_SOILPARM.TBL"
general_table    = "TBL_GENPARM.TBL"
noahmp_table     = "TBL_MPTABLE.TBL"


[mizuRoute]

namelist_path = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_wolverine/"
namelist_file = "mizuroute.param"

methods = "3"
dt      = 3600

write_qbasin = false
write_Qreach = false


[hydrofabric]

hfabric_path = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_wolverine/"
hfabric_file = "topology.nc"

dname_seg = "seg"
dname_hru = "hru"

varname_HRUid     = "hruId"
varname_segId     = "segId"
varname_hruSegId  = "hruToSegId"
varname_downSegId = "downSegId"

varname_area   = "area"
varname_slope  = "slope"
varname_length = "length"


[calibration]

algorithm = "nsga2"

start_date = "2016-10-01"
end_date   = "2018-07-31"

n_samples = 48

param_list = [
    "frozenPrecipMultip",
    "tempCritRain",
    "glacierWindFactor",
    "glacierTempReduction",
    "albedoMax",
    "aquiferBaseflowExp",
    "k_soil",
    "vGn_n",
    "theta_sat",
    "Fcapil"
]

write_aligned = false


[calibration.nsga2]

population_size = 8


[[calibration.target]]

name      = "discharge"
variable  = "streamflow"
reach     = 2
obs_path  = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_wolverine/observations/"
obs_file  = "wolverine_USGS_15236900_daily_flow.nc"
vname_obs = "q_obs"
metric    = "kge"


[[calibration.target]]

name      = "stream_temperature"
variable  = "T_reach"
reach     = 2
obs_path  = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_wolverine/observations/"
obs_file  = "wolverine_USGS_15236900_daily_temperature.nc"
vname_obs = "t_obs"
metric    = "rmse"


[[calibration.target]]

name      = "mass_balance"
variable  = "basin__GlacierMassChange"
gru       = 2
obs_path  = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_wolverine/observations/"
obs_file  = "wolverine_mass_balance_seasonal.nc"
vname_obs = "mb_obs"
metric    = "rmse"
accumulate = true
balance    = "seasonal"


[[calibration.target]]

name      = "well"
variable  = "scalarAquiferStorage"
hru       = 5
obs_path  = "/Users/amedin/Research/SummaSundials/summa/utils/test/test_calibration/gulkana_wolverine/observations/"
obs_file  = "wolverine_well_hru5_daily.nc"
vname_obs = "well_obs"
metric    = "rmse"



[calibration.parameter_transformations]

k_soil = "log"
